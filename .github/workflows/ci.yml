name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tracedrop
          POSTGRES_USER: tracedrop
          POSTGRES_PASSWORD: tracedrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracedrop -d tracedrop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://tracedrop:tracedrop@localhost:5432/tracedrop?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Install database tooling
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Validate SQL
        run: sqlc compile
      - name: Run migrations
        run: goose -dir db/migrations postgres "$DATABASE_URL" up
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
