services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
