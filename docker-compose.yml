services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracedrop
      POSTGRES_USER: tracedrop
      POSTGRES_PASSWORD: tracedrop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracedrop -d tracedrop"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - tracedrop_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tracedrop:tracedrop@postgres:5432/tracedrop?sslmode=disable}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  tracedrop_postgres:
